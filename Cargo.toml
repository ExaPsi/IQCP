[workspace]
resolver = "2"
members = [
    "crates/qc-core",
    "crates/qc-wasm",
    "crates/qc-wasm-spectra",
    "crates/qc-io",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
authors = ["IQCP Contributors"]
license = "MIT"
repository = "https://github.com/ExaPsi/IQCP"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# WASM support
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
wasm-bindgen-rayon = "1.2"

# Parallelism
rayon = "1.10"

# Error handling
thiserror = "1.0"

# Numerical
num-traits = "0.2"
nalgebra = "0.33"
libm = "0.2"

# Testing
approx = "0.5"
proptest = "1.4"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = "debuginfo"

# Per-package size optimization for WASM crates
[profile.release.package.qc-wasm]
opt-level = "z"

[profile.release.package.qc-wasm-spectra]
opt-level = "z"
